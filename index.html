<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Watch the world change shape. Explore 16 animated map projections, highlight a country, and compare distortion with equal-area Tissot circles.">
  <title>Map projections</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/d3.min.js"></script>
  <script defer src="./vendor/d3-geo-projection.min.js"></script>
  <script defer src="./vendor/topojson-client.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="controls" role="group" aria-label="Map controls">
    <div class="field">
      <label for="projection">Projection</label>
      <select id="projection" disabled aria-describedby="projection-description"><option>Loading…</option></select>
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country" disabled><option>Loading…</option></select>
    </div>
    <button id="tissot-toggle" type="button" aria-pressed="false" aria-describedby="tissot-description" disabled>Tissot Circles</button>
  </header>

  <main id="map-stage" class="map-stage" aria-label="Interactive world map">
    <svg id="world-map" role="img" aria-labelledby="map-title map-description" preserveAspectRatio="xMidYMid meet">
      <title id="map-title">World map</title>
      <desc id="map-description">Choose a projection and a country using the controls above.</desc>
      <g id="map-layers">
        <path id="ocean" class="ocean"/>
        <path id="graticule" class="graticule"/>
        <path id="land" class="land"/>
        <path id="borders" class="borders"/>
        <path id="selected-country" class="selected-country"/>
        <g id="indicators" class="indicators" hidden></g>
        <path id="outline" class="outline"/>
      </g>
    </svg>
    <div class="status" id="loading" role="status">Loading map…</div>
    <div class="status" id="error" role="alert" hidden>The map couldn’t load. Please refresh to try again.</div>
    <p class="sr-only" id="projection-description"></p>
    <p class="sr-only" id="tissot-description">The two circles have a 5° radius and equal area on the globe. Their projected shapes show distortion.</p>
    <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript><div class="status">Enable JavaScript to explore the map projections.</div></noscript>
  </main>
</body>
</html>
